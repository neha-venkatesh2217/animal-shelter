<html>
<head>
    <title>Register</title>
</head>
<body>

    <!--registration form-->
    <h2>Register</h2>

    <!--send the form data to the register endpoint-->
    <form action="http://localhost:3001/register" method="POST">

        <!--enter username-->
        <label for="username">Username</label><br>
        <input type="text" name="username" id="username" size="20" required/><br>

        <!--enter email-->
        <label for="email">Email</label><br>
        <input type="email" name="email" id="email" size="40" required/><br>

        <!--enter password-->
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password" size="30" required/><br>

        <!--submit the form-->
        <input type="submit" value="Register"/>

    </form>

    <!--link to the login page-->
    <p>Already registered? <a href="login.html">Login here</a></p>

</body>
</html>
