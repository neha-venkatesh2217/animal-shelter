<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Animal Shelter</title>
  <link rel="stylesheet" href="/account.css" />
  <script src="/account.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner page-width">
      <a class="brand" href="/" aria-label="Animal Shelter home">
        <span class="brand-mark" aria-hidden="true">AS</span>
        <span>Animal Shelter<small>Placeholder shelter name</small></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/#find-an-animal">Find an Animal</a>
      </nav>
      <nav class="account-links" aria-label="Account">
        <a href="/login.html" aria-current="page">Login</a>
        <a class="nav-register" href="/register.html">Register</a>
      </nav>
    </div>
  </header>
  <main id="main-content" class="account-main page-width">
    <section class="account-card" aria-labelledby="account-heading">
      <p class="eyebrow">Welcome back</p>
      <h1 id="account-heading">Login</h1>
      <p class="intro">Enter your username and password to log in.</p>
      <!--send the form to the existing backend route-->
      <p id="form-error" role="alert"></p>
      <form action="http://localhost:3001/login" method="POST">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input type="password" name="password" id="password" autocomplete="current-password" required />
        <button type="submit">Login</button>
      </form>
      <p class="switch-page">Don't have an account? <a href="/register.html">Register here</a></p>
    </section>
  </main>
  <footer><div class="page-width"><p>Animal Shelter</p><small>Placeholder shelter name</small></div></footer>
  <dialog id="success-dialog" class="success-dialog" aria-labelledby="success-title" aria-describedby="success-message">
    <p class="eyebrow">Animal Shelter</p>
    <h2 id="success-title">Welcome back</h2>
    <p id="success-message"></p>
    <button type="button" autofocus>OK, go home</button>
  </dialog>
</body>
</html>
